[project]
name = "gatedmind"
version = "0.1.0rc1"
description = "Permission-aware RAG demo that measures leaks across four ways to enforce access rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = ["numpy>=1.26", "mcp==2.3.0"]

[project.optional-dependencies]
dense = ["fastembed>=0.9,<0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gatedmind = "gatedmind.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatedmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
